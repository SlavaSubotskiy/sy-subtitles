name: Sync Subtitles
run-name: "Sync: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    # ready_for_review is NOT in the default set — it is the moment the SPA's
    # edit auto-sync finalizes its draft PR, and exactly when the sync must run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'talks/*/transcript_uk.txt'
      - 'talks/*/*/final/uk.srt'

permissions:
  contents: write

# Overlapping runs race on the final push: the loser's push is rejected
# non-fast-forward, which would surface as a spurious red on a PR whose
# sync actually succeeded. One run per PR, newest wins.
concurrency:
  group: sync-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # Draft PRs are the SPA edit auto-sync's live workspace: it commits the
    # edited files in the background every few seconds of editing. Running
    # the reconciliation on each of those pushes would be a CI storm, and
    # its bot commits would race the client's next push. Sync only real PRs.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # tools.sync_pr resolves its own baseline — the last bot sync commit
      # on this branch, else the merge-base with main — then runs the
      # two-pass SRT↔transcript sync (with per-video effective-old
      # baselines for mixed PRs) against a shadow copy of each talk. It
      # writes nothing unless every target of every talk succeeded, so a
      # non-zero exit means the working tree is untouched and there is no
      # partial result to preserve. Failures come out as ::error:: lines.
      - name: Sync, optimize, validate
        run: python -m tools.sync_pr

      - name: Refresh typo-hint wordlist
        # A reviewer's edit is a corpus change: site/dict/words_uk.txt is
        # generated from transcript_uk.txt and final/uk.srt, the two files this
        # bot rewrites. Fix a transliteration and the committed list still
        # describes the OLD spelling — so the SPA underlines the very word the
        # reviewer just chose, and the guard in ci.yml fails whichever pull
        # request happens to come next. Rebuild it here, where the change is
        # made, exactly as the pipeline does for the talks it builds.
        #
        # Gated on success() for the same reason the commit below is: a failed
        # sync leaves the tree untouched, so there is nothing new to describe.
        if: success()
        run: python -m tools.build_wordlist

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add talks/*/*/final/uk.srt talks/*/transcript_uk.txt site/dict/words_uk.txt
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          # [skip ci]: this commit is the RESULT of the sync. Pushing it back
          # re-triggers this same pull_request workflow (paths match
          # final/uk.srt); that second run sees both transcript and SRT
          # changed vs the PR base and runs the reverse SRT->transcript pass,
          # which conflicts with the just-applied edit and fails red. The
          # skip-ci token stops the bot commit from recursively triggering us.
          # The Sync-Bot trailer is how the next run recognises this commit
          # as its own and anchors its diff here instead of on the PR base
          # (tools.sync_pr.resolve_baseline). Author + trailer must both
          # match, so the user.name above is load-bearing too.
          git commit -m "Sync subtitles and transcript edits [skip ci]" -m "Sync-Bot: v1"
          git push
